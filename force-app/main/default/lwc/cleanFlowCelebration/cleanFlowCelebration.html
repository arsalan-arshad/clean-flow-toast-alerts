<template>
    <div class="celebration-container">
        <!-- Canvas for full-container / viewport confetti animation -->
        <canvas class="celebration-canvas" lwc:dom="manual"></canvas>

        <!-- Optional Celebration Card -->
        <template if:true={showCard}>
            <div class="slds-box slds-theme_default celebration-card slds-text-align_center slds-p-around_large">
                <template if:true={badgeText}>
                    <div class="slds-m-bottom_small">
                        <span class="slds-badge celebration-badge">{badgeText}</span>
                    </div>
                </template>

                <h1 class="slds-text-heading_large celebration-title slds-m-bottom_x-small">
                    {displayTitle}
                </h1>

                <template if:true={cardSubtitle}>
                    <p class="slds-text-body_regular slds-text-color_weak celebration-subtitle slds-m-bottom_medium">
                        {cardSubtitle}
                    </p>
                </template>

                <div class="slds-grid slds-grid_align-center slds-gutters_small action-buttons">
                    <template if:true={hasAction}>
                        <div class="slds-col">
                            <lightning-button
                                label={actionButtonLabel}
                                variant="brand"
                                onclick={handleActionClick}
                            ></lightning-button>
                        </div>
                    </template>

                    <div class="slds-col">
                        <lightning-button
                            label="Replay Celebration 🎊"
                            variant="neutral"
                            onclick={handleReplay}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
